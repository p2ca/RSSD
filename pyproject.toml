[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rssd"
version = "0.1.0"
description = "Reservoir Shared-Specific Decomposition for multi-day reservoir inflow forecasting under hydroclimatic regime shift"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "TBD" }
keywords = [
    "reservoir inflow forecasting",
    "transfer learning",
    "hydrology",
    "domain adaptation",
    "LSTM",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "torch>=2.1",
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
    "scikit-learn>=1.3",
    "tqdm>=4.65",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
figures = ["matplotlib>=3.7"]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
rssd = ["py.typed"]
